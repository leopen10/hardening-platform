[defaults]
inventory           = inventory/hosts.ini
roles_path          = roles
remote_user         = ansible
host_key_checking   = False
stdout_callback     = yaml
retry_files_enabled = False
forks               = 10
timeout             = 30

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root

[ssh_connection]
pipelining  = True

